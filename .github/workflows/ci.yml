name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate draft eval labels
        run: python tools/validate_day3_drafts.py

      - name: Type check (mypy)
        run: mypy

      - name: Test (fast suite; frozen-integrity and architecture tests run here)
        run: pytest -m "not slow"
