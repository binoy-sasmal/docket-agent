[project]
name = "docket"
version = "0.1.0"
description = "An ERP invoice exception agent that investigates, cites its evidence, and proposes -- but cannot post."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "langgraph>=1.0",
    # Durable checkpoints for restart-safe approval (docket.durable). 3.1.2
    # requires langgraph-checkpoint>=4.3; the lock stays on 4.2 deliberately.
    "langgraph-checkpoint-sqlite>=3.1,<3.1.2",
    # Connected mode's OData client (docket.tools.odata_http). Already locked
    # transitively; named here because docket now imports it directly.
    "httpx>=0.27",
    "langchain-groq>=0.2",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
]
# The web layer in ui/. Kept out of the core dependencies and out of
# requirements-dev.lock.txt on purpose: CI lints, type-checks, tests and runs
# the eval gate without ever installing a web server, so the UI cannot become
# a way for the gates to fail.
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# `ui/` is deliberately not in this list. Adding it would make the CI type
# gate depend on FastAPI being installed, coupling the system under test's
# gates to its viewer. Check it explicitly when working on it:
#     mypy ui/api --ignore-missing-imports
files = ["src", "tools"]

[tool.pytest.ini_options]
markers = [
    "slow: full-log runs, not part of the fast default suite",
    "llm: hits the live Groq API; requires GROQ_API_KEY and network access",
    "erp: needs the CAP mock ERP running and DOCKET_ERP_URL set (connected mode)",
]
testpaths = ["tests"]
